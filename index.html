html,body{margin:0;padding:0;background:#000;color:#f8fafc;min-height:100%}
body{padding:32px 20px;display:flex;justify-content:center;align-items:flex-start}
.card{background:#0a0a0a;border:2.5px solid #262626;border-radius:30px;padding:48px 40px;max-width:1025px;width:100%;box-shadow:0 15px 50px rgba(0,0,0,.85);text-align:center}
h2{margin:0 0 12px;font-size:3.1rem;color:#fff}
p.sub{margin:0 0 24px;font-size:1.95rem;color:#a3a3a3}
p.sub strong{color:#facc15}
.status{font-size:1.5rem;color:#737373;margin-bottom:30px}
.reset-link{color:#a78bfa;text-decoration:underline;cursor:pointer;margin-left:10px;font-size:1.35rem}
.input-row{display:flex;gap:20px;justify-content:center;margin-bottom:30px}
input{width:340px;padding:20px 26px;font-size:2.8rem;font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:8px;background:#171717;color:#fff;border:4px solid #333;border-radius:20px;outline:none;transition:border-color .2s}
input::placeholder{color:#525252}input:focus{border-color:#8b5cf6}
.btn-group{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
button{padding:20px 36px;font-size:1.95rem;font-weight:600;border:none;border-radius:18px;cursor:pointer;transition:opacity .2s,transform .1s}
button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:not-allowed}
.btn-hint{background:#1f1f1f;color:#e5e5e5;border:2.5px solid #333}
.btn-solve{background:#7c3aed;color:#fff}
button:hover:not(:disabled){opacity:.88}
#output{margin-top:40px;padding-top:30px;border-top:2px solid #1f1f1f;text-align:center;min-height:120px}
#output:empty{display:none}
.error{color:#f87171;font-size:1.9rem;font-weight:500}
.info{color:#a3a3a3;font-size:1.9rem;margin-bottom:24px}
.thinking{color:#a78bfa;font-size:1.95rem;font-weight:600;animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.ladder{display:flex;flex-direction:column;align-items:center;gap:14px}
.step-row{display:flex;align-items:center;justify-content:center;gap:18px;animation:fadeInStep .45s ease-out forwards}
@keyframes fadeInStep{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.step{background:#171717;border:2.5px solid #2e2e2e;padding:14px 42px;border-radius:15px;font-weight:700;letter-spacing:8px;font-size:2.5rem;color:#f5f5f5}
.step.goal{background:#422006;border-color:#f59e0b;color:#fde68a}
.skip-btn{background:#450a0a;color:#fca5a5;border:2.5px solid #7f1d1d;font-size:1.45rem;padding:10px 18px;border-radius:12px;font-weight:600}
.arrow{color:#737373;font-size:1.8rem;line-height:1;animation:fadeInStep .35s ease-out forwards}
</style></head><body>

const stEl=document.getElementById("dictStatus"),out=document.getElementById("output"),
inp=document.getElementById("startWord"),bH=document.getElementById("btnHint"),
bS=document.getElementById("btnSolve");
function upd(){stEl.textContent="Ready ("+D.size.toLocaleString()+" four-letter words loaded)";
if(BLOCKED.size>1){const r=document.createElement("span");r.className="reset-link";

r.onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};

function bfs(s){if(s==="POOP")return["POOP"];const wl=new Set(D);wl.add(s);wl.add("POOP");
const q=[[s]],v=new Set([s]),az="ABCDEFGHIJKLMNOPQRSTUVWXYZ";while(q.length){
const p=q.shift(),c=p[p.length-1];for(let i=0;i<4;i++){const pre=c.slice(0,i),suf=c.slice(i+1);
for(let j=0;j<26;j++){const ch=az[j];if(ch===c[i])continue;const nx=pre+ch+suf;
if(nx==="POOP")return[...p,"POOP"];if(wl.has(nx)&&!v.has(nx)){v.add(nx);q.push([...p,nx])}}}}return null}

if(s.length!==4){out.textContent="";const err=document.createElement("div");err.className="error";
err.textContent="Please enter a valid 4-letter word.";out.appendChild(err);return}
setDis(true);out.textContent="";const th=document.createElement("div");th.className="thinking";
th.textContent="Finding path to POOP...";out.appendChild(th);timers.push(setTimeout(()=>{
const path=bfs(s);out.textContent="";if(!path){setDis(false);const err=document.createElement("div");
err.className="error";err.textContent="No path found from "+s+" to POOP.";out.appendChild(err);return}
const steps=mode==="hint"?path.slice(0,2):path;const inf=document.createElement("div");inf.className="info";
inf.textContent=mode==="hint"?"Next step hint":"Solved in "+(path.length-1)+" step"+(path.length-1===1?"":"s");
out.appendChild(inf);const ld=document.createElement("div");ld.className="ladder";out.appendChild(ld);

r.className="step-row";const st=document.createElement("div");st.className="step"+(w==="POOP"?" goal":"");

D.delete(w);BLOCKED.add(w);try{localStorage.setItem(KEY,JSON.stringify([...BLOCKED]))}catch(e){}
upd();run(lastMode)});r.appendChild(sk)}ld.appendChild(r);
